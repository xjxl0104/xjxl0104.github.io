<style>
@font-face{font-family:"YS Pixel";src:url("assets/retro/fusion-pixel-12-subset.woff2") format("woff2");font-display:swap}
:root{--mono:"YS Pixel","SFMono-Regular",Menlo,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse 85% 75% at 50% 46%,#f1f1f3 0%,#d9d9dd 52%,#a9a9b0 100%);font:16px/1.4 var(--mono);color:#000;-webkit-font-smoothing:none}
html[data-lang="zh"] .lang-en,html[data-lang="en"] .lang-zh{display:none}
#css,#gl{position:fixed;inset:0;width:100%;height:100%}
#css{z-index:0}
#css iframe{border:0;background:#000;pointer-events:none!important}
html.at-screen #css iframe{pointer-events:auto!important}
#gl{z-index:1;pointer-events:none;display:block}
#grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.07;mix-blend-mode:multiply;animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.18) 100%)}

/* 左上角名牌 */
#hud{position:fixed;left:max(24px,env(safe-area-inset-left));top:max(24px,env(safe-area-inset-top));z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:6px;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
#hud .tag{background:#000;color:#fff;padding:2px 12px;min-height:26px;white-space:nowrap}
#hud .row{display:flex;gap:6px}
#hud button{display:grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border:0;background:#000;color:#fff;font:inherit;cursor:pointer}
#hud button:hover,#hud button:focus-visible{background:#fff;color:#000;outline:1px solid #000}
#hud svg{width:14px;height:14px;fill:currentColor}
#hud #back{display:none}
html.at-desk #hud #back,html.at-screen #hud #back{display:grid}
/* 进到屏幕里时名牌让位，只在左下角留“退后” */
html.at-screen #hud{top:auto;bottom:max(10px,env(safe-area-inset-bottom))}
html.at-screen #hud .tag,html.at-screen #hud #btnSound,html.at-screen #hud #btnView{display:none}
html.at-screen #hud .row{gap:0}

#hint{position:fixed;left:50%;bottom:max(36px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;background:#000;color:#fff;padding:3px 14px;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
#hint.on{opacity:1}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 开场加载框 */
#loader{position:fixed;inset:0;z-index:10;background:#000;color:#fff;display:grid;place-items:center;padding:20px;transition:opacity .6s}
#loader.out{opacity:0;pointer-events:none}
#loader .box{border:4px solid #fff;padding:22px 26px;min-width:min(520px,92vw);max-width:92vw}
#loader pre{margin:0 0 6px;font:inherit;white-space:pre-wrap;color:#bdbdbd;min-height:6.5em}
#loader .title{color:#fff}
#start{display:block;margin:16px auto 2px;padding:4px 18px;border:2px solid #fff;background:#000;color:#fff;font:inherit;cursor:pointer}
#start:hover,#start:focus-visible{background:#fff;color:#000;outline:0}
#start[disabled]{opacity:.35;cursor:wait}
#loader .alt{margin-top:14px;font-size:12px;color:#8a8a8a;text-align:center}
#loader .alt a{color:#bdbdbd}

.skip{position:fixed;left:8px;top:8px;z-index:20;padding:6px 10px;background:#000;color:#fff;transform:translateY(-200%)}
.skip:focus{transform:none}

@media (max-width:700px){
  body{font-size:14px}
  #hud{left:14px;top:14px}
  #hud .tag{min-height:22px;padding:1px 8px}
  #hud button{height:22px;min-width:22px}
}
@media (prefers-reduced-motion:reduce){#grain,.cur{animation:none}}
</style>
</head>

<script type="module">
import * as THREE from './assets/vendor/three.module.min.js';
import { CSS3DRenderer, CSS3DObject } from './assets/vendor/CSS3DRenderer.js';
import { RoomEnvironment } from './assets/vendor/RoomEnvironment.js';

const d = document.documentElement;
const $ = (s) => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = () => innerWidth < 700;
const L = (zh, en) => (d.dataset.lang === 'en' ? en : zh);
const log = $('#ldLog');
const say = (s, nl = true) => { log.textContent += s + (nl ? '\n' : ''); };
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

say(L('YW 作品集加载器 v2026', 'YW Portfolio Loader v2026'));
say(L('正在载入 three.js ………… 完成', 'Loading three.js ............ OK'));

/* ================= 渲染器 ================= */
const canvas = $('#gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {
  say(L('这台设备打不开 WebGL。', 'WebGL is not available here.'));
  $('#start').hidden = true;
  $('.alt a').textContent = L('→ 直接打开作品集', '→ Open the portfolio');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 60);

const css = new CSS3DRenderer();
$('#css').appendChild(css.domElement);
const cssScene = new THREE.Scene();
const cssCam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 5, 6000);
const CSS_SCALE = 100; // CSS 层用厘米，避免极小的 matrix3d 数值

/* ================= 灯光 ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b9c0, 0.75));
const key = new THREE.DirectionalLight(0xfff6ea, 2.1);
key.position.set(2.6, 5.2, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2.2; key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.2; key.shadow.camera.bottom = -2.2;
key.shadow.camera.near = 1; key.shadow.camera.far = 14;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe6ff, 0.55);
fill.position.set(-4, 2.5, 1.5);
scene.add(fill);

/* ================= 材质与小工具 ================= */
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
const beige = M(0xd9d4c6, { roughness: 0.55 });
const beigeDark = M(0xc4bead, { roughness: 0.6 });
const deskTop = M(0x2e2e30, { roughness: 0.5 });
const metal = M(0x9fa2a7, { roughness: 0.38, metalness: 0.65 });
const darkMetal = M(0x3a3b3f, { roughness: 0.45, metalness: 0.5 });
const black = M(0x161616, { roughness: 0.5 });
const paper = M(0xf4f3ef, { roughness: 0.9 });
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, dd, mat, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, dd), mat, x, y, z, p);
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function rrect(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2);
  s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  return s;
}
function rbox(w, h, dd, r, mat, x, y, z, p) {
  const g = new THREE.ExtrudeGeometry(rrect(w, h, r), { depth: dd - 2 * Math.min(r, dd / 3), bevelEnabled: true, bevelThickness: Math.min(r, dd / 3), bevelSize: Math.min(r, dd / 3) * 0.9, bevelSegments: 3, curveSegments: 6 });
  g.center();
  return mesh(g, mat, x, y, z, p);
}

say(L('正在搭建书桌 ………………… ', 'Building the desk ........... '), false);

/* ================= 地面（只接影子，透出 CSS 背景） ================= */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

/* ================= 书桌 ================= */
const TOP = 0.75;
const desk = new THREE.Group(); scene.add(desk);
rbox(1.62, 0.036, 0.82, 0.008, deskTop, 0, TOP - 0.018, 0, desk);
box(1.5, 0.06, 0.03, darkMetal, 0.04, TOP - 0.07, -0.37, desk); // 背板横梁
for (const z of [-0.36, 0.36]) {
  box(0.04, TOP - 0.036, 0.04, metal, 0.76, (TOP - 0.036) / 2, z, desk);
}
box(0.04, 0.04, 0.72, metal, 0.76, 0.12, 0, desk);
// 左侧抽屉柜
const ped = new THREE.Group(); ped.position.set(-0.55, 0, 0); desk.add(ped);
box(0.44, TOP - 0.036 - 0.03, 0.76, M(0xb8bbc0, { roughness: 0.45, metalness: 0.35 }), 0, (TOP - 0.066) / 2 + 0.03, 0, ped);
for (const [y, h] of [[0.58, 0.16], [0.3, 0.36]]) {
  box(0.4, h - 0.012, 0.012, M(0xc9ccd1, { roughness: 0.4, metalness: 0.3 }), 0, y, 0.385, ped);
  box(0.12, 0.016, 0.02, darkMetal, 0, y + h / 2 - 0.05, 0.4, ped);
}
for (const x of [-0.2, 0.2]) box(0.03, 0.03, 0.74, darkMetal, x, 0.015, 0, ped);

/* ================= 电脑主机 ================= */
const pc = new THREE.Group(); pc.position.set(0, TOP, -0.12); scene.add(pc);
rbox(0.46, 0.13, 0.42, 0.012, beige, 0, 0.065, 0, pc);
box(0.13, 0.012, 0.004, black, 0.12, 0.075, 0.211, pc);       // 软驱口
box(0.15, 0.03, 0.004, beigeDark, 0.12, 0.045, 0.211, pc);    // 光驱面板
box(0.022, 0.012, 0.006, beigeDark, -0.17, 0.08, 0.211, pc);  // 电源键
mesh(new THREE.SphereGeometry(0.0035, 8, 8), new THREE.MeshBasicMaterial({ color: 0x3dff6a }), -0.13, 0.08, 0.212, pc);
// 显示器底座
mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.02, 32), beigeDark, 0, 0.14, 0, pc);
box(0.08, 0.04, 0.08, beigeDark, 0, 0.165, -0.01, pc);

/* ================= 显示器 ================= */
const mon = new THREE.Group(); mon.position.set(0, TOP + 0.13 + 0.235, -0.04); scene.add(mon);
const BW = 0.43, BH = 0.375, SW = 0.32, SH = 0.24, SY = 0.018; // 外框与屏幕（4:3）
{
  const outer = rrect(BW, BH, 0.018);
  const hole = rrect(SW + 0.024, SH + 0.022, 0.012); // 屏幕开口
  const holePath = new THREE.Path(); holePath.setFromPoints(hole.getPoints(8).map((p) => new THREE.Vector2(p.x, p.y + SY)).reverse());
  outer.holes.push(holePath);
  const g = new THREE.ExtrudeGeometry(outer, { depth: 0.045, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 3, curveSegments: 8 });
  g.translate(0, 0, -0.045);
  mesh(g, beige, 0, 0, 0, mon);
  // 屏幕四周向内收的斜边（显像管外沿）
  const tunnel = new THREE.Mesh(new THREE.CylinderGeometry(Math.SQRT2 * (SW / 2 + 0.012), Math.SQRT2 * (SW / 2 + 0.002), 0.03, 4, 1, true, Math.PI / 4), M(0x2a2a2a, { roughness: 0.7, side: THREE.DoubleSide }));
  tunnel.rotation.set(Math.PI / 2, 0, 0); tunnel.scale.set(1, 1, (SH + 0.022) / (SW + 0.024));
  tunnel.position.set(0, SY, -0.02); mon.add(tunnel);
  // 机身：后部收窄的显像管外壳
  const back = new THREE.Mesh(new THREE.CylinderGeometry(Math.SQRT2 * 0.2, Math.SQRT2 * 0.12, 0.3, 4, 1, false, Math.PI / 4), beige);
  back.rotation.set(Math.PI / 2, 0, 0); back.scale.set(1, 1, 0.86);
  back.position.set(0, 0.0, -0.2); back.castShadow = back.receiveShadow = true; mon.add(back);
  box(0.24, 0.16, 0.06, beigeDark, 0, -0.01, -0.37, mon);
  // 铭牌、电源灯
  const badge = new THREE.Mesh(new THREE.PlaneGeometry(0.075, 0.022), new THREE.MeshStandardMaterial({ map: canvasTex(300, 88, (g, w, h) => {
    g.fillStyle = '#d9d4c6'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#3a3a3a'; g.beginPath(); g.arc(30, 44, 22, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#d9d4c6'; g.font = 'bold 26px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('YW', 30, 46);
    g.fillStyle = '#2b2b2b'; g.textAlign = 'left'; g.font = 'italic bold 34px Georgia, serif'; g.fillText('Yusong', 62, 34);
    g.font = '18px Georgia, serif'; g.fillText('Systems Lab', 64, 66);
  }), roughness: 0.6 }));
  badge.position.set(-0.15, -0.165, 0.0062); mon.add(badge);
  mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.006, 20), beigeDark, 0.17, -0.165, 0.004, mon).rotation.x = Math.PI / 2;
  mesh(new THREE.SphereGeometry(0.003, 8, 8), new THREE.MeshBasicMaterial({ color: 0x3dff6a }), 0.15, -0.165, 0.006, mon);
}
// 屏幕：在 WebGL 里“挖洞”，让后面的网页透出来
const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0, blending: THREE.NoBlending }));
screenMesh.position.set(0, SY, -0.03); mon.add(screenMesh);
// 玻璃反光
const glass = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, map: canvasTex(256, 192, (g, w, h) => {
  const r = g.createRadialGradient(w * 0.5, h * 0.5, h * 0.25, w * 0.5, h * 0.5, w * 0.62);
  r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,0.42)'); g.fillStyle = r; g.fillRect(0, 0, w, h);
  const l = g.createLinearGradient(0, 0, w, h); l.addColorStop(0, 'rgba(255,255,255,0.10)'); l.addColorStop(0.3, 'rgba(255,255,255,0.015)'); l.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = l; g.fillRect(0, 0, w, h);
}) }));
glass.position.set(0, SY, -0.029); mon.add(glass);

/* ================= 键盘与鼠标 ================= */
const kb = new THREE.Group(); kb.position.set(-0.02, TOP, 0.2); kb.rotation.set(0.05, 0, 0); scene.add(kb);
rbox(0.47, 0.026, 0.165, 0.006, beige, 0, 0.013, 0, kb);
{
  const keyGeo = new THREE.BoxGeometry(0.0155, 0.009, 0.0155);
  const keys = new THREE.InstancedMesh(keyGeo, M(0xe6e1d4, { roughness: 0.5 }), 120);
  const keys2 = new THREE.InstancedMesh(keyGeo, M(0xb9b4a6, { roughness: 0.5 }), 40);
  keys.castShadow = keys2.castShadow = true;
  const m4 = new THREE.Matrix4(); let n1 = 0, n2 = 0;
  const put = (x, z, sx = 1, dark = false) => { m4.makeScale(sx, 1, 1).setPosition(x, 0.031, z); if (dark) keys2.setMatrixAt(n2++, m4); else keys.setMatrixAt(n1++, m4); };
  for (let r = 0; r < 5; r++) for (let c = 0; c < 14; c++) put(-0.215 + c * 0.0185 + (r % 2) * 0.004, -0.045 + r * 0.0185, 1, c === 0 || c === 13);
  put(-0.09, 0.048, 7.2);                                                           // 空格
  for (let c = 0; c < 12; c++) put(-0.215 + c * 0.0195, -0.07, 1, true);            // 功能键
  for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) put(0.105 + c * 0.0185, -0.045 + r * 0.0185, 1, c === 3); // 小键盘
  keys.count = n1; keys2.count = n2; kb.add(keys, keys2);
}
const mouse = mesh(new THREE.SphereGeometry(1, 24, 16), beige, 0.33, TOP + 0.012, 0.22);
mouse.scale.set(0.032, 0.018, 0.05);
box(0.003, 0.004, 0.03, beigeDark, 0.33, TOP + 0.03, 0.2);
function cable(points, r = 0.0035) {
  const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p))), 48, r, 6, false);
  return mesh(g, M(0x2a2a2a, { roughness: 0.7 }));
}
cable([[0.33, TOP + 0.006, 0.172], [0.32, TOP + 0.004, 0.06], [0.26, TOP + 0.004, -0.06], [0.2, TOP + 0.006, -0.32]]);
cable([[-0.02, TOP + 0.006, 0.115], [-0.03, TOP + 0.004, 0.05], [-0.08, TOP + 0.004, -0.33]]);
cable([[0.0, TOP + 0.3, -0.42], [0.06, TOP + 0.08, -0.4], [0.18, TOP + 0.004, -0.36], [0.6, TOP + 0.004, -0.38], [0.79, 0.4, -0.42], [0.82, 0.02, -0.45]], 0.004);

/* ================= 桌上的东西 ================= */
// 纸堆

let osReady = false;

addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || !e.data.yw) return;
  const m = e.data;

  else if (m.type === 'click') sfx.click();

});

/* ================= 声音（WebAudio 合成：房间底噪、主机嗡声、硬盘与按键） ================= */
const sfx = (() => {
  let ctx = null, master = null, on = true;
  try { on = localStorage.getItem('yw-sound') !== '0'; } catch (e) {}
  function noiseBuf(sec, brown) {
    const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), ch = b.getChannelData(0); let last = 0;
    for (let i = 0; i < ch.length; i++) { const w = Math.random() * 2 - 1; ch[i] = brown ? (last = (last + 0.02 * w) / 1.02) * 3.5 : w; }
    return b;
  }
  function loop(buf, filterType, freq, gain) {
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = gain; s.connect(f).connect(g).connect(master); s.start();
  }
  function burst(freq, dur, gain, q = 1.2) {
    if (!ctx || !on) return;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf(dur, false);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); const t = ctx.currentTime; g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(master); s.start();
  }
  return {
    get on() { return on; },
    start() {
      if (ctx) return;
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      master = ctx.createGain(); master.gain.value = on ? 1 : 0; master.connect(ctx.destination);
      loop(noiseBuf(4, true), 'lowpass', 500, 0.05);             // 房间底噪
      loop(noiseBuf(3, false), 'bandpass', 1300, 0.006);         // 主机风扇
      for (const [fq, gn] of [[60, 0.012], [120, 0.006]]) { const o = ctx.createOscillator(); o.frequency.value = fq; const g = ctx.createGain(); g.gain.value = gn; o.connect(g).connect(master); o.start(); }
    },
    set(v) { on = v; if (master) master.gain.setTargetAtTime(v ? 1 : 0, ctx.currentTime, 0.05); },
    click() { burst(2600, 0.03, 0.35, 0.9); setTimeout(() => burst(1800, 0.025, 0.2, 0.9), 70); },
    key() { burst(3200 + Math.random() * 800, 0.025, 0.25, 0.8); },
    boot() { // 开机：硬盘寻道的咔哒声
      if (!ctx) return;
      for (let i = 0; i < 26; i++) setTimeout(() => burst(900 + Math.random() * 1400, 0.018, 0.18 + Math.random() * 0.12, 2), 300 + i * (90 + Math.random() * 110));
    },
  };
})();
function paintSound() {
  $('#sndIcon').innerHTML = sfx.on
    ? '<path d="M2 6h3l4-4v12l-4-4H2z"/><path d="M11 5c1.2 1.2 1.2 4.8 0 6M13 3c2.4 2.4 2.4 7.6 0 10" stroke="currentColor" fill="none" stroke-width="1.4"/>'
    : '<path d="M2 6h3l4-4v12l-4-4H2z"/><path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.6"/>';
}
function setSound(v, tell = true) { sfx.set(v); store('yw-sound', v ? '1' : '0'); paintSound(); if (tell) toOS({ type: 'sound', on: v }); }
paintSound();
$('#btnSound').addEventListener('click', (e) => { e.stopPropagation(); sfx.start(); setSound(!sfx.on); });

/* ================= 镜头 ================= */
const target = new THREE.Vector3(), camPos = new THREE.Vector3();
const views = {
  overview(t) {
    const a = 0.5 + (reduce ? 0 : Math.sin(t * 0.06) * 0.45), r = small() ? 8.2 : 5.6;
    return { pos: new THREE.Vector3(Math.sin(a) * r, small() ? 3.6 : 2.9, Math.cos(a) * r), look: new THREE.Vector3(0.12, 0.5, 0.05) };
  },
  desk() {
    // 竖屏要退远才装得下显示器，镜头抬高从椅背上方看过去
    if (camera.aspect < 0.9) return { pos: new THREE.Vector3(0, TOP + 0.78, 2.05), look: new THREE.Vector3(0, TOP + 0.24, -0.1) };
    return { pos: new THREE.Vector3(0, TOP + 0.5, 1.42), look: new THREE.Vector3(0, TOP + 0.22, -0.1) };
  },
  screen() {
    const vf = THREE.MathUtils.degToRad(camera.fov), fitH = (SH / 0.86) / 2 / Math.tan(vf / 2), fitW = (SW / 0.9) / 2 / (Math.tan(vf / 2) * camera.aspect);
    const dist = Math.max(fitH, fitW);
    return { pos: screenPos.clone().addScaledVector(screenNormal, dist), look: screenPos.clone() };
  },
};
let state = 'loading', from = null, tween = null, clock0 = performance.now();
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
function go(next) {
  if (next === state && !tween) return;
  const t = (performance.now() - clock0) / 1000;
  from = { pos: camera.position.clone(), look: target.clone() };
  tween = { t0: performance.now(), dur: reduce ? 1 : next === 'screen' || state === 'screen' ? 1100 : 1700, to: next };
  state = next;
  d.classList.toggle('at-screen', next === 'screen');
  d.classList.toggle('at-desk', next === 'desk');
  $('#hint').classList.toggle('on', next === 'overview');
  if (next === 'screen') setTimeout(() => { try { frame.focus(); } catch (e) {} }, 400);
  if (next !== 'screen' && document.activeElement === frame) frame.blur();
}
let px = 0, py = 0;
function frameCamera(now) {
  const t = (now - clock0) / 1000;
  const v = views[state === 'loading' ? 'overview' : state](t);
  if (state === 'desk' && !reduce) { v.pos.x += px * 0.05; v.pos.y += -py * 0.03; }
  if (tween) {
    let k = Math.min(1, (now - tween.t0) / tween.dur); k = ease(k);
    camera.position.lerpVectors(from.pos, v.pos, k); target.lerpVectors(from.look, v.look, k);
    if (k >= 1) tween = null;
  } else {
    camera.position.lerp(v.pos, state === 'overview' ? 1 : 0.08); target.lerp(v.look, state === 'overview' ? 1 : 0.08);
  }
  camera.lookAt(target);
}

/* ================= 交互 ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const monitorParts = []; mon.traverse((o) => o.isMesh && monitorParts.push(o)); pc.traverse((o) => o.isMesh && monitorParts.push(o));
function hit(e, list) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.intersectObjects(list, false)[0]; }
let hoverT = 0, outT = 0;
addEventListener('pointermove', (e) => {
  px = e.clientX / innerWidth - 0.5; py = e.clientY / innerHeight - 0.5;
  if (state === 'desk' && !tween && e.pointerType === 'mouse') {
    if (hit(e, [screenMesh])) { if (!hoverT) hoverT = setTimeout(() => { hoverT = 0; if (state === 'desk') go('screen'); }, 160); }
    else { clearTimeout(hoverT); hoverT = 0; }
  }
  if (state === 'screen' && !tween && e.pointerType === 'mouse') {
    // 指针只有离开 iframe 时父页面才收得到移动事件
    if (!outT) outT = setTimeout(() => { outT = 0; if (state === 'screen') go('desk'); }, 260);
  }
});
frame.addEventListener('pointerenter', () => { clearTimeout(outT); outT = 0; });
addEventListener('click', (e) => {
  if (state === 'loading' || e.target.closest('#hud,#loader,a,button')) return;
  sfx.click();
  if (state === 'overview') go('desk');
  else if (state === 'desk') {
    if (hit(e, [screenMesh])) { if (small()) { location.href = 'os.html'; } else go('screen'); }
    else if (!hit(e, monitorParts)) go('overview');
  } else if (state === 'screen') go('desk');
});
addEventListener('keydown', (e) => {
  if (state === 'loading') return;
  if (e.key === 'Escape') go(state === 'screen' ? 'desk' : 'overview');
  else if (e.key === 'Enter' && document.activeElement === document.body) go(state === 'overview' ? 'desk' : 'screen');
});
$('#btnView').addEventListener('click', (e) => { e.stopPropagation(); go(state === 'overview' ? 'desk' : 'overview'); });
$('#back').addEventListener('click', (e) => { e.stopPropagation(); go(state === 'screen' ? 'desk' : 'overview'); });

/* ================= 名牌、提示与时钟 ================= */
function typeInto(el, text, delay = 0) {
  el.textContent = '';
  if (reduce) { el.textContent = text; return; }
  [...text].forEach((ch, i) => setTimeout(() => { el.textContent += ch; }, delay + i * 45));
}
function typeHud(instant) {
  const n = L('王钰淞 · Yusong Wang', 'Yusong Wang · 王钰淞'), r = L('GIS × 多模态 AI × 全栈系统', 'GIS × Multimodal AI × Systems');
  if (instant) { $('#hudName').textContent = n; $('#hudRole').textContent = r; } else { typeInto($('#hudName'), n); typeInto($('#hudRole'), r, 600); }
  $('#hintText').textContent = small() ? L('点一下开始', 'Tap to begin') : L('点击任意位置开始', 'Click anywhere to begin');
  frame.title = L('王钰淞的作品集电脑', "Yusong Wang's portfolio computer");
}
function tick() { const t = new Date(), p = (n) => String(n).padStart(2, '0'); $('#hudClock').textContent = `${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`; }
tick(); setInterval(tick, 1000);

/* ================= 开场 ================= */
function enableStart() { const b = $('#start'); b.disabled = false; b.focus(); }
$('#langLd').addEventListener('click', (e) => { e.preventDefault(); d.dataset.lang = d.dataset.lang === 'en' ? 'zh' : 'en'; store('yw-lang', d.dataset.lang); toOS({ type: 'lang', lang: d.dataset.lang }); });

  sfx.start(); sfx.click();
  toOS({ type: 'lang', lang: d.dataset.lang }); toOS({ type: 'sound', on: sfx.on }); toOS({ type: 'power' });
  $('#loader').classList.add('out'); setTimeout(() => { $('#loader').hidden = true; }, 700);
  $('#hud').classList.add('on'); typeHud(false);
  clock0 = performance.now(); state = 'overview'; $('#hint').classList.add('on');
  if (/[#&]desk\b/.test(location.hash)) setTimeout(() => go('desk'), 300);
});

/* ================= 渲染循环 ================= */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); css.setSize(w, h);
  camera.aspect = cssCam.aspect = w / h; camera.updateProjectionMatrix(); cssCam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
{ const v = views.overview(0); camera.position.copy(v.pos); target.copy(v.look); camera.lookAt(target); }
function render(now) {
  frameCamera(now);
  renderer.render(scene, camera);
  cssCam.position.copy(camera.position).multiplyScalar(CSS_SCALE); cssCam.quaternion.copy(camera.quaternion);
  cssCam.fov = camera.fov; cssCam.updateProjectionMatrix(); cssCam.updateMatrixWorld();
  css.render(cssScene, cssCam);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* 胶片颗粒：运行时生成一张噪声图 */
{
  const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'), im = g.createImageData(160, 160);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); $('#grain').style.background = `url(${c.toDataURL()}) repeat`;
}
