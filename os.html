<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YW/OS 98 · Yusong Wang</title>
<meta name="description" content="王钰淞（Yusong Wang）的作品集，运行在一台复古电脑的 YW/OS 98 桌面里。" />
<style>
/* Fusion Pixel 12px（SIL OFL 1.1），按站内用字子集化：中文 98 年代界面的 12px 点阵宋体味道 */
@font-face{font-family:"YS Pixel";src:url("assets/retro/fusion-pixel-12-subset.woff2") format("woff2");font-display:swap}
:root{
  --face:#c0c0c0;--light:#dfdfdf;--hi:#fff;--shadow:#808080;--dark:#0a0a0a;
  --title:#000080;--title2:#1084d0;--desk:#2e7d7a;--sel:#000080;
  --ui:"YS Pixel","Tahoma","Microsoft YaHei",sans-serif;
  --serif:"Times New Roman","Songti SC","STSong","SimSun","Noto Serif SC",serif;
  --out:inset -1px -1px var(--dark),inset 1px 1px var(--hi),inset -2px -2px var(--shadow),inset 2px 2px var(--light);
  --in:inset -1px -1px var(--hi),inset 1px 1px var(--shadow),inset -2px -2px var(--light),inset 2px 2px var(--dark);
  --field:inset -1px -1px var(--hi),inset 1px 1px var(--shadow),inset -2px -2px var(--light),inset 2px 2px var(--dark);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{font:12px/16px var(--ui);color:#000;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none}
html[data-lang="zh"] .lang-en,html[data-lang="en"] .lang-zh{display:none}
button{font:inherit;color:inherit}
img{-webkit-user-drag:none}
:focus-visible{outline:1px dotted #000;outline-offset:-4px}

/* ===== 开机 ===== */
/* 没开机时屏幕是黑的；点“开始”后直接亮起桌面，不放开机动画 */
#boot{position:fixed;inset:0;z-index:100;background:#000}

/* ===== 桌面 ===== */
#desktop{position:fixed;inset:0 0 30px 0;background:var(--desk);overflow:hidden}
#icons{position:absolute;inset:8px auto 8px 8px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px 10px;width:auto;max-height:calc(100% - 16px)}
.icon{display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;padding:2px;border:0;background:none;color:#fff;cursor:default;text-align:center}
.icon svg{width:32px;height:32px;shape-rendering:crispEdges;image-rendering:pixelated}
.icon span{padding:1px 2px;line-height:14px;text-shadow:none}
.icon.sel span{background:var(--sel);outline:1px dotted #ff0}
.icon.sel svg{filter:brightness(.6) sepia(1) hue-rotate(190deg) saturate(4)}

.win{position:absolute;display:flex;flex-direction:column;min-width:220px;min-height:120px;background:var(--face);box-shadow:var(--out);padding:3px}
.win[hidden]{display:none}
.win.max{inset:0!important;width:auto!important;height:auto!important}
.tb{display:flex;align-items:center;gap:4px;height:20px;padding:0 2px 0 4px;background:linear-gradient(90deg,var(--title),var(--title2));color:#fff;font-weight:700;flex:none;cursor:default;touch-action:none}
.win:not(.active) .tb{background:linear-gradient(90deg,#808080,#b5b5b5);color:#d6d6d6}
.tb .ti{width:16px;height:16px;flex:none}
.tb .tt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb button{width:18px;height:16px;padding:0;border:0;background:var(--face);box-shadow:var(--out);display:grid;place-items:center;flex:none}
.tb button:active{box-shadow:var(--in)}
.tb button svg{width:10px;height:10px;shape-rendering:crispEdges}
.tb button+button.cl{margin-left:2px}
.menubar{display:flex;gap:2px;padding:2px 0;flex:none}
.menubar span{padding:1px 6px}
.menubar span u{text-decoration:underline}
.body{flex:1;min-height:0;position:relative}
.sb{display:flex;gap:2px;margin-top:2px;flex:none}
.sb span{flex:1;padding:1px 4px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb span:last-child{flex:0 0 120px}
.grip{position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 0 45%,var(--shadow) 45% 52%,var(--hi) 52% 58%,transparent 58% 66%,var(--shadow) 66% 73%,var(--hi) 73% 79%,transparent 79%)}
.win.max .grip{display:none}

.pane{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;box-shadow:var(--field);padding:2px;user-select:text;-webkit-user-select:text}
.pane::-webkit-scrollbar{width:16px;height:16px;background:repeating-conic-gradient(var(--face) 0 25%,#fff 0 50%) 0 0/2px 2px}
.pane::-webkit-scrollbar-thumb{background:var(--face);box-shadow:var(--out)}
.pane::-webkit-scrollbar-button:single-button{background:var(--face);box-shadow:var(--out);height:16px;width:16px;display:block}
.pane::-webkit-scrollbar-corner{background:var(--face)}

/* ===== 任务栏 ===== */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;gap:4px;padding:2px;background:var(--face);box-shadow:inset 0 1px var(--light),inset 0 2px var(--hi);z-index:50}
#start{display:flex;align-items:center;gap:4px;height:24px;padding:0 6px 0 4px;border:0;background:var(--face);box-shadow:var(--out);font-weight:700}
#start.on{box-shadow:var(--in)}
#start svg{width:18px;height:16px;shape-rendering:crispEdges}
#tasks{flex:1;min-width:0;display:flex;gap:3px;overflow:hidden}
#tasks button{flex:0 1 160px;min-width:40px;height:24px;display:flex;align-items:center;gap:4px;padding:0 6px;border:0;background:var(--face);box-shadow:var(--out);text-align:left;white-space:nowrap;overflow:hidden}
#tasks button svg{width:16px;height:16px;flex:none;shape-rendering:crispEdges}
#tasks button span{overflow:hidden;text-overflow:ellipsis}
#tasks button.on{box-shadow:var(--in);background:repeating-conic-gradient(var(--face) 0 25%,#fff 0 50%) 0 0/2px 2px;font-weight:700}
#tray{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--shadow)}
#tray button{border:0;background:none;padding:0 2px;cursor:default}
#tray svg{width:16px;height:16px;shape-rendering:crispEdges;display:block}

#startmenu{position:fixed;left:2px;bottom:28px;z-index:60;display:flex;background:var(--face);box-shadow:var(--out);padding:3px}
#startmenu[hidden]{display:none}
#startmenu .band{width:24px;background:linear-gradient(0deg,var(--title),var(--title2));color:#c0c0c0;writing-mode:vertical-rl;transform:rotate(180deg);font:700 16px/24px var(--serif);padding:8px 0;letter-spacing:.06em;white-space:nowrap}
#startmenu .band b{color:#fff}
#startmenu ul{list-style:none;margin:0;padding:0;min-width:190px}
#startmenu li button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 20px 0 6px;border:0;background:none;text-align:left}
#startmenu li button svg{width:24px;height:24px;shape-rendering:crispEdges}
#startmenu li button:hover,#startmenu li button:focus-visible{background:var(--sel);color:#fff;outline:0}
#startmenu li.sep{height:2px;margin:3px 2px;box-shadow:inset 0 1px var(--shadow),inset 0 -1px var(--hi)}

/* ===== 作品集（展示窗口里的网站） ===== */
.site{font:16px/1.65 var(--serif);color:#111;user-select:text;-webkit-user-select:text}
.site a{color:#0000ee}
.site a:visited{color:#551a8b}
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.home h1{margin:0;font:900 64px/1.05 var(--serif);letter-spacing:.02em}
.home h1 small{display:block;margin-top:8px;font-size:22px;font-weight:700;letter-spacing:.08em}
.home .tag{margin:14px 0 0;font:700 18px/1.4 var(--serif)}
.home nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 30px;margin-top:44px;font:700 17px var(--serif)}
.home nav a{text-transform:uppercase}
.page{display:grid;grid-template-columns:200px 1fr;gap:36px;padding:34px 40px 50px}
.page aside{position:sticky;top:0;align-self:start}
.page aside .nm{font:900 30px/1.05 var(--serif)}
.page aside .yr{margin:6px 0 34px;font:700 17px var(--serif)}
.page aside nav{display:flex;flex-direction:column;gap:18px;font:700 16px var(--serif)}
.page aside nav a{text-transform:uppercase}
.page aside nav a.cur::before{content:"○ ";color:#000}
.page article{min-width:0}
.page h2{margin:0 0 4px;font:900 46px/1.1 var(--serif)}
.page h3{margin:26px 0 8px;font:900 22px/1.3 var(--serif)}
.page h4{margin:18px 0 4px;font:700 17px/1.35 var(--serif)}
.page p{margin:0 0 12px}
.page ul{margin:0 0 12px;padding-left:22px}
.page .lead{font-weight:700;font-size:18px}
.page .meta{color:#555;font-size:14px}
.page hr{border:0;border-top:2px solid #000;margin:22px 0}
.page .box{display:flex;gap:14px;align-items:center;border-top:2px solid #000;border-bottom:2px solid #000;padding:12px 0;margin:20px 0}
.page .box svg{width:42px;height:42px;flex:none;shape-rendering:crispEdges}
.page .box b{display:block;font-size:20px}
.page figure{margin:14px 0 22px}
.page figure img{display:block;width:100%;height:auto;border:1px solid #000;cursor:zoom-in}
.page figcaption{font-size:14px;color:#333;margin-top:6px}
.page figcaption b{color:#000}
.page .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.page .stats div{border:2px solid #000;padding:6px 8px;text-align:center}
.page .stats b{display:block;font:900 28px/1.1 var(--serif)}
.page .stats span{font-size:13px}
.page .when{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page .when span{font-weight:700;white-space:nowrap}
.page .when span:not(:last-child){white-space:normal}
.page .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.page .grid figure{margin:0}
.page .tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.page .tags span{border:1px solid #000;padding:0 6px;font-size:14px;line-height:22px}
.page form{display:grid;gap:10px;max-width:520px}
.page label{font-weight:700}
.page input,.page textarea{font:16px var(--serif);padding:6px 8px;border:0;box-shadow:var(--field);background:#fff}
.page .btn{justify-self:start;font:12px var(--ui);padding:5px 18px;border:0;background:var(--face);box-shadow:var(--out);cursor:pointer}
.page .btn:active{box-shadow:var(--in)}
.page .subnav{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0 18px;font-weight:700}
.page .subnav a.cur{color:#000;text-decoration:none}
.page .subnav a.cur::before{content:"○ "}
.foot{position:sticky;bottom:0}

/* 记事本 / 看图 */
.note{font:12px/18px var(--ui);padding:6px 8px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.viewer{display:grid;place-items:center;background:#808080}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.dlg{display:flex;gap:14px;padding:16px 14px 8px;align-items:flex-start}
.dlg svg{width:32px;height:32px;flex:none;shape-rendering:crispEdges}
.dlgbtns{display:flex;justify-content:center;gap:8px;padding:10px}
.dlgbtns a,.dlgbtns button{min-width:80px;padding:4px 12px;border:0;background:var(--face);box-shadow:var(--out);color:#000;text-decoration:none;text-align:center}
.dlgbtns a:active,.dlgbtns button:active{box-shadow:var(--in)}

/* CRT：只在嵌进三维显示器时叠加扫描线和暗角 */
#crt{position:fixed;inset:0;pointer-events:none;z-index:200;display:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.10) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.42) 100%)}
html.embed #crt{display:block}
html.embed body{cursor:default}

@media (max-width:700px){
  .icon{width:68px}
  .page{grid-template-columns:1fr;gap:16px;padding:20px 16px 40px}
  .page aside{position:static}
  .page aside .yr{margin-bottom:12px}
  .page aside nav{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
  .page article{min-width:0;overflow-wrap:anywhere}
  .page h2{font-size:34px}
  .page .stats{grid-template-columns:repeat(2,1fr)}
  .home h1{font-size:46px}
  #tasks button{flex-basis:110px}
}
</style>
</head>

        <label for="mf-msg"><span class="lang-zh">想说的话</span><span class="lang-en">Message</span></label><textarea id="mf-msg" name="msg" rows="6"></textarea>
        <button class="btn" type="submit"><span class="lang-zh">用邮件程序发送</span><span class="lang-en">Send with your mail app</span></button>
      </form>
      <p class="meta"><span class="lang-zh">这里不会上传任何内容：点“发送”只会打开你自己的邮件程序。</span><span class="lang-en">Nothing is uploaded: “Send” only opens your own mail app.</span></p>
    </article>
  </section>
</div>

<script>
(function(){
'use strict';
var d=document.documentElement,EMBED=d.classList.contains('embed');
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function post(msg){if(EMBED&&parent!==window)parent.postMessage(Object.assign({yw:1},msg),location.origin)}
function L(zh,en){return '<span class="lang-zh">'+zh+'</span><span class="lang-en">'+en+'</span>'}

/* ---------- 声音交给外层页面播放（嵌入时），独立打开时静音 ---------- */
document.addEventListener('pointerdown',function(){post({type:'click'})},true);
document.addEventListener('keydown',function(e){if(e.key.length===1||e.key==='Enter'||e.key==='Backspace')post({type:'key'})},true);
var sound=true;try{sound=localStorage.getItem('yw-sound')!=='0'}catch(e){}
function paintSnd(){$('#btnSnd use').setAttribute('href',sound?'#i-snd':'#i-mute')}
paintSnd();
$('#btnSnd').addEventListener('click',function(){sound=!sound;store('yw-sound',sound?'1':'0');paintSnd();post({type:'sound',on:sound})});

/* ---------- 语言与时钟 ---------- */
function setLang(l){d.dataset.lang=l;store('yw-lang',l);post({type:'lang',lang:l});tick()}
$('#btnLang').addEventListener('click',function(){setLang(d.dataset.lang==='en'?'zh':'en')});
function tick(){var t=new Date(),h=t.getHours(),m=t.getMinutes(),p=function(n){return (n<10?'0':'')+n};
  $('#clock').textContent=d.dataset.lang==='en'?((h%12||12)+':'+p(m)+' '+(h<12?'AM':'PM')):(h<12?'上午 ':'下午 ')+(h%12||12)+':'+p(m)}
tick();setInterval(tick,10000);
addEventListener('message',function(e){
  if(e.origin!==location.origin||!e.data||!e.data.yw)return;
  if(e.data.type==='power')powerOn();
  if(e.data.type==='ping')post({type:'ready'});
  if(e.data.type==='lang'&&e.data.lang!==d.dataset.lang){d.dataset.lang=e.data.lang;tick()}
  if(e.data.type==='sound'){sound=e.data.on;paintSnd()}
});

/* ---------- 窗口管理 ---------- */
var desk=$('#desktop'),tasks=$('#tasks'),Z=10,wins={};
function bounds(){return desk.getBoundingClientRect()}
function focusWin(w){if(!w)return;Z++;w.el.style.zIndex=Z;Object.keys(wins).forEach(function(k){var o=wins[k];o.el.classList.toggle('active',o===w&&!o.el.hidden);o.task.classList.toggle('on',o===w&&!o.el.hidden)})}
function makeWin(id,o){
  if(wins[id]){var w0=wins[id];w0.el.hidden=false;focusWin(w0);return w0}
  var el=document.createElement('section');el.className='win';el.setAttribute('role','dialog');el.setAttribute('aria-label',o.label||id);
  el.innerHTML='<div class="tb"><svg class="ti"><use href="#'+o.icon+'"/></svg><span class="tt">'+o.title+'</span>'+
    '<button type="button" data-act="min" aria-label="最小化 / Minimize"><svg><use href="#i-min"/></svg></button>'+
    (o.fixed?'':'<button type="button" data-act="max" aria-label="最大化 / Maximize"><svg><use href="#i-max"/></svg></button>')+
    '<button type="button" class="cl" data-act="close" aria-label="关闭 / Close"><svg><use href="#i-x"/></svg></button></div>'+
    (o.menu?'<div class="menubar">'+o.menu+'</div>':'')+
    '<div class="body"></div>'+(o.status?'<div class="sb"><span>'+o.status+'</span><span></span></div>':'')+(o.fixed?'':'<div class="grip"></div>');
  $('.body',el).appendChild(o.content);
  desk.appendChild(el);
  var b=bounds(),small=b.width<700;
  var W=Math.min(o.w||520,b.width-16),H=Math.min(o.h||380,b.height-16);
  var n=Object.keys(wins).length;
  el.style.width=W+'px';el.style.height=H+'px';
  el.style.left=Math.max(4,Math.min(b.width-W-4,(o.x!=null?o.x:(b.width-W)/2+n*18)))+'px';
  el.style.top=Math.max(4,Math.min(b.height-H-4,(o.y!=null?o.y:(b.height-H)/2+n*18-10)))+'px';
  if(o.max||(small&&!o.fixed))el.classList.add('max');
  var task=document.createElement('button');task.type='button';task.innerHTML='<svg><use href="#'+o.icon+'"/></svg><span>'+o.title+'</span>';
  tasks.appendChild(task);
  var w={id:id,el:el,task:task};wins[id]=w;
  task.addEventListener('click',function(){if(!el.hidden&&el.classList.contains('active')){el.hidden=true;focusWin(null);task.classList.remove('on')}else{el.hidden=false;focusWin(w)}});
  el.addEventListener('pointerdown',function(){focusWin(w)});
  $$('.tb [data-act]',el).forEach(function(bt){bt.addEventListener('click',function(e){e.stopPropagation();var a=bt.dataset.act;
    if(a==='close'){el.remove();task.remove();delete wins[id];if(o.onclose)o.onclose()}
    else if(a==='min'){el.hidden=true;task.classList.remove('on');el.classList.remove('active')}
    else if(a==='max'){el.classList.toggle('max')}})});
  $('.tb',el).addEventListener('dblclick',function(e){if(!o.fixed&&!e.target.closest('button'))el.classList.toggle('max')});
  drag($('.tb',el),el,'move');var g=$('.grip',el);if(g)drag(g,el,'size');
  focusWin(w);if(o.onopen)o.onopen(w);
  return w;
}
function drag(handle,el,mode){
  handle.addEventListener('pointerdown',function(e){
    if(e.button!==0||e.target.closest('button')||el.classList.contains('max'))return;
    e.preventDefault();handle.setPointerCapture(e.pointerId);
    var sx=e.clientX,sy=e.clientY,r=el.getBoundingClientRect(),b=bounds(),ox=r.left-b.left,oy=r.top-b.top,ow=r.width,oh=r.height;
    function mv(ev){var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(mode==='move'){el.style.left=Math.max(-ow+60,Math.min(b.width-60,ox+dx))+'px';el.style.top=Math.max(0,Math.min(b.height-22,oy+dy))+'px'}
      else{el.style.width=Math.max(240,ow+dx)+'px';el.style.height=Math.max(140,oh+dy)+'px'}}
    function up(){handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up)}
    handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
  });
}
function div(cls,html){var e=document.createElement('div');e.className=cls;if(html!=null)e.innerHTML=html;return e}

/* ---------- 作品集窗口 ---------- */
var WORKS=[
  ['dipark','DIPARK · 智慧云仓','DIPARK · Smart park','以三维楼宇总览连接空间出租、租金收缴、物业工单与能源信息。截图中的运营指标为演示数据。','A 3D building overview brings together occupancy, rent collection, property work orders and energy. Metrics shown are demo data.',2400,1327],
  ['ai-gateway','AI 中台 · LLM 网关','AI hub · LLM gateway','统一管理模型接入与调用，集中呈现调用日志、引擎巡检、费用流向和钱包续航。','A shared console for model access and calls, with call logs, engine probes, cost flows and wallet budget estimates.',2400,1342],
  ['tunan-data-lab','图南 · Data Lab','Tunan · Data Lab','以径向关系图组织数据源与分析维度，结合供应商探针、财报接口和抓取流水视图。截图中的流水、股价与持仓因子为 DEMO 模拟。','A radial view connects data sources with analysis dimensions, alongside provider probes, financial APIs and a fetch feed. Feed, prices and factors shown are DEMO simulations.',2400,1339],
  ['ops-monitor','运维总控 · Ops Monitor','Operations console · Ops Monitor','将服务入口、自动化任务、备份与通知链路放到同一张拓扑视图，配合待处理事项和延迟趋势定位问题。','Endpoints, scheduled jobs, backups and notifications share one topology view, with an attention queue and latency trends.',2400,1471],
  ['enterprise-portal','企业应用门户','Enterprise application portal','按企业管理、园区运营与技术服务组织应用，并提供运维中心、文档、产品资料与代码仓库入口。','Applications grouped by enterprise management, park operations and technical services, with links to ops, docs, product materials and repositories.',2400,1096]
];
var ART=[['ai_cover','作品集封面','Portfolio cover',1600,900],['ai_method','创作方法地图','Creative method map',1280,936],['ai_lishishi','李师师 · 分镜','Li Shishi · storyboard',1280,752],['ai_straw_boats','草船借箭','Straw Boats',1280,874],['ai_star','The Star · 改写','The Star · rewrite',1280,714],['ai_twodimensional','二向箔','Two-Dimensional Foil',1280,720],['ai_qingming','清明上河图 RPG','Qingming RPG',1280,954],['ai_boat_style','训练与风格转译','Training & style transfer',1280,712],['ai_touchdesigner','TouchDesigner 实时','TouchDesigner realtime',1280,720]];
function aside(){return '<div class="nm">'+L('王钰淞','Yusong<br />Wang')+'</div><div class="yr">'+L('作品集 ’26','Showcase ’26')+'</div><nav><a href="#home">Home</a><a href="#about">About</a><a href="#experience">Experience</a><a href="#projects">Projects</a><a href="#contact">Contact</a></nav>'}
function siteNode(){
  var html=$('#site').innerHTML.split('{{ASIDE}}').join(aside())
    .replace('{{WORKS}}',WORKS.map(function(w){return '<figure><img src="'+('assets/work/'+w[0]+'.webp')+'" width="'+w[5]+'" height="'+w[6]+'" alt="'+w[1]+' / '+w[2]+'" loading="lazy" data-view /><figcaption><b>'+L(w[1],w[2])+'</b><br />'+L(w[3],w[4])+'</figcaption></figure>'}).join(''))
    .replace('{{ART}}',ART.map(function(a){return '<figure><img src="'+('assets/ai_portfolio/'+a[0]+'.jpg')+'" width="'+a[3]+'" height="'+a[4]+'" alt="'+a[1]+' / '+a[2]+'" loading="lazy" data-view /><figcaption>'+L(a[1],a[2])+'</figcaption></figure>'}).join(''));
  var t=document.createElement('template');t.innerHTML=html;return t.content.firstElementChild;
}
var PAGES={home:['主页','Home'],about:['关于我','About Me'],experience:['经历','Experience'],projects:['项目','Projects'],contact:['联系','Contact']};
function winTitle(hash){var p=PAGES[(hash||'#home').slice(1).split('/')[0]]||PAGES.home;return L('王钰淞 - '+p[0],'Yusong Wang - '+p[1])}
function route(pane,hash){
  var h=(hash||'#home').slice(1).split('/'),page=h[0]||'home',sub=h[1];
  var site=$('.site',pane);if(!$('[data-page="'+page+'"]',site))page='home';
  $$('[data-page]',site).forEach(function(s){s.hidden=s.dataset.page!==page});
  $$('aside nav a',site).forEach(function(a){a.classList.toggle('cur',a.getAttribute('href')==='#'+page)});
  if(page==='projects'){sub=sub||'heritage';$$('[data-sub]',site).forEach(function(s){s.hidden=s.dataset.sub!==sub});$$('.subnav a',site).forEach(function(a){a.classList.toggle('cur',a.getAttribute('href')==='#projects/'+sub)})}
  pane.scrollTop=0;
  var w=wins.show;if(w){$('.tt',w.el).innerHTML=$('span',w.task).innerHTML=winTitle('#'+page)}
  if(w)$('.sb span',w.el).textContent='http://yusong.wang/'+(page==='home'?'':page+(sub&&page==='projects'?'/'+sub:''));
}
function openShow(hash){
  if(wins.show){wins.show.el.hidden=false;focusWin(wins.show);if(hash)route($('.pane',wins.show.el),hash);return}
  var pane=div('pane');pane.style.padding='0';pane.appendChild(siteNode());
  pane.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();route(pane,a.getAttribute('href'));return}
    var im=e.target.closest('img[data-view]');if(im){openViewer(im.getAttribute('src'),im.getAttribute('alt'))}
  });
  var f=$('#mailform',pane);
  f.addEventListener('submit',function(e){e.preventDefault();var n=$('#mf-name',f).value.trim(),m=$('#mf-msg',f).value.trim();
    location.href='mailto:ywang677@connect.hkust-gz.edu.cn?subject='+encodeURIComponent((d.dataset.lang==='en'?'Hello from ':'来自作品集的问候 · ')+(n||'a visitor'))+'&body='+encodeURIComponent(m)});
  var b=bounds();
  makeWin('show',{icon:'i-show',title:winTitle(hash||'#home'),content:pane,status:'© 2026 Yusong Wang',w:Math.min(b.width-90,900),h:b.height-40,x:Math.max(84,(b.width-Math.min(b.width-90,900))/2+30),y:12});
  route(pane,hash||'#home');
}

/* ---------- 其他程序 ---------- */
function openViewer(src,alt){
  var v=div('pane viewer');v.style.padding='0';var im=new Image();im.src=src;im.alt=alt||'';v.appendChild(im);
  if(wins.viewer){$('.body',wins.viewer.el).replaceChildren(v);$('.tt',wins.viewer.el).textContent=src.split('/').pop()+' - '+(d.dataset.lang==='en'?'Image Viewer':'看图');wins.viewer.el.hidden=false;focusWin(wins.viewer);return}
  makeWin('viewer',{icon:'i-pic',title:src.split('/').pop()+' - '+L('看图','Image Viewer'),content:v,status:L('点“原图”可在新标签页打开','Use the link to open full size')+' · <a href="'+src+'" target="_blank" rel="noopener">'+L('原图','full size')+'</a>',w:760,h:500});
}
function openDialog(id,icon,title,html,buttons){
  var c=div('');c.innerHTML='<div class="dlg"><svg><use href="#'+icon+'"/></svg><div>'+html+'</div></div><div class="dlgbtns">'+buttons+'</div>';
  var w=makeWin(id,{icon:icon,title:title,content:c,fixed:true,w:400,h:190});
  $$('[data-close]',c).forEach(function(b){b.addEventListener('click',function(){$('[data-act="close"]',w.el).click()})});
  return w;
}
function openNote(id,title,text){var p=div('pane note');p.textContent=text;makeWin(id,{icon:'i-note',title:title,content:p,menu:'<span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>S</u>earch</span><span><u>H</u>elp</span>',w:520,h:360})}
var OPEN={
  show:function(){openShow()},
  about:function(){openShow('#about')},
  projects:function(){openShow('#projects')},
  cv:function(){openDialog('cv','i-pdf',L('简历.pdf','Resume.pdf'),L('<b>CV_Yusong_Wang.pdf</b><br />王钰淞 · 2026 年 10 月版简历，1 页。','<b>CV_Yusong_Wang.pdf</b><br />Yusong Wang · October 2026 resume, one page.'),
    '<a href="CV_Yusong_Wang.pdf" target="_blank" rel="noopener">'+L('打开','Open')+'</a><a href="CV_Yusong_Wang.pdf" download>'+L('下载','Download')+'</a><button type="button" data-close>'+L('取消','Cancel')+'</button>')},
  mail:function(){openShow('#contact')},
  credits:function(){openNote('credits',L('关于本站.txt - 记事本','Credits.txt - Notepad'),d.dataset.lang==='en'
    ?'YW/OS 98 — Yusong Wang, 2026\r\n\r\nThis homepage is a desk you can walk up to: a 3D studio scene (three.js) with a computer whose screen runs this little operating system.\r\n\r\nInspired by Henry Heffernan\'s portfolio (henryheffernan.com). The scene, models, icons, operating system and words here are my own.\r\n\r\nType: Fusion Pixel 12px (SIL Open Font License 1.1)\r\n3D: three.js (MIT)\r\n\r\nContact: ywang677@connect.hkust-gz.edu.cn'
    :'YW/OS 98 —— 王钰淞，2026\r\n\r\n这个主页是一张可以走近的书桌：three.js 搭的三维摄影棚里放着一台电脑，屏幕里运行的就是这个小小的操作系统。\r\n\r\n灵感来自 Henry Heffernan 的作品集（henryheffernan.com）。这里的场景、模型、图标、系统界面和文字都是我自己做的。\r\n\r\n字体：Fusion Pixel 12px（SIL 开源字体许可 1.1）\r\n三维：three.js（MIT）\r\n\r\n联系：ywang677@connect.hkust-gz.edu.cn')},
  off:function(){if(EMBED)post({type:'leave'});else openDialog('off','i-off',L('离开电脑','Step away'),L('在独立窗口里打开时没有书桌可以退回。要去三维书桌吗？','There is no desk to step back to in this tab. Go to the 3D desk?'),'<a href="index.html">'+L('去书桌','Go to desk')+'</a><button type="button" data-close>'+L('留下','Stay')+'</button>')}
};
function launch(k){closeStart();if(OPEN[k])OPEN[k]()}

/* 桌面图标：单击选中、双击打开；触屏单击即打开 */
var coarse=matchMedia('(pointer: coarse)').matches;
$$('#icons .icon').forEach(function(b){
  b.addEventListener('click',function(){$$('#icons .icon').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');if(coarse)launch(b.dataset.open)});
  b.addEventListener('dblclick',function(){launch(b.dataset.open)});
  b.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();launch(b.dataset.open)}});
});
desk.addEventListener('pointerdown',function(e){if(e.target===desk||e.target.id==='icons')$$('#icons .icon').forEach(function(x){x.classList.remove('sel')})});

/* 开始菜单 */
var sm=$('#startmenu'),st=$('#start');
function closeStart(){sm.hidden=true;st.classList.remove('on');st.setAttribute('aria-expanded','false')}
st.addEventListener('click',function(e){e.stopPropagation();var open=sm.hidden;sm.hidden=!open;st.classList.toggle('on',open);st.setAttribute('aria-expanded',String(open));if(open)$('button',sm).focus()});
$$('#startmenu [data-open]').forEach(function(b){b.addEventListener('click',function(){launch(b.dataset.open)})});
document.addEventListener('pointerdown',function(e){if(!sm.hidden&&!sm.contains(e.target)&&e.target!==st&&!st.contains(e.target))closeStart()});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(!sm.hidden){closeStart();return}if(EMBED)post({type:'leave'})});

/* ---------- 开机 ---------- */
var booted=false;
function powerOn(){if(booted)return;booted=true;$('#boot').hidden=true;openShow()}
/* 独立打开时直接开机；嵌在显示器里时等外层点“开始” */
if(!EMBED)powerOn();else{$('#boot').hidden=false;post({type:'ready'})}
})();
</script>
