<style>
  :root{
    --sumi:#2b2230; --washi:#fbf3e1; --washi-d:#ecdcbc; --red:#d64933; --gold:#f2c14e; --indigo:#34467d;
    --font:'DotGothic16','Noto Sans SC','Hiragino Sans','PingFang SC','Yu Gothic',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--sumi);background:#f3dcc4;overflow:hidden;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
  body.read{overflow:auto;background:#f3e6cf}
  body[data-lang="zh"] .lang-en{display:none !important}
  body[data-lang="en"] .lang-zh{display:none !important}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit}

  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;outline:none}

  /* pixel window: stepped corners + hard edges */
  .px{
    background:var(--washi);color:var(--sumi);
    box-shadow:-3px 0 0 var(--sumi),3px 0 0 var(--sumi),0 -3px 0 var(--sumi),0 3px 0 var(--sumi),
      inset -3px -3px 0 rgba(0,0,0,.1),inset 3px 3px 0 rgba(255,255,255,.55);
  }
  .pxbtn{
    background:var(--washi);color:var(--sumi);border:0;padding:.34rem .7rem;font-size:.85rem;line-height:1.4;
    box-shadow:-3px 0 0 var(--sumi),3px 0 0 var(--sumi),0 -3px 0 var(--sumi),0 3px 0 var(--sumi),inset -3px -3px 0 rgba(0,0,0,.14);
    text-decoration:none;display:inline-block;margin:3px;white-space:nowrap;transition:background .12s, transform .08s;
  }
  .pxbtn:hover,.pxbtn:focus-visible{background:var(--gold);outline:0}
  .pxbtn:active{transform:translateY(2px)}
  .pxbtn.red{background:var(--red);color:#fff}
  .pxbtn.red:hover{background:#e8604a}
  .pxbtn[aria-pressed="true"]{background:#6f9a4f;color:#fff}

  /* HUD */
  .hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;gap:6px;padding:14px 16px;pointer-events:none}
  .hud > *{pointer-events:auto}
  .brand{margin:3px auto 3px 3px;padding:.4rem .8rem;line-height:1.25}
  .brand b{font-weight:400;font-size:1.06rem;letter-spacing:.04em;white-space:nowrap}
  .brand b em{font-style:normal;color:var(--red)}
  .brand small{display:block;font-size:.7rem;opacity:.65}
  .tools{display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}

  .dock{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;
    display:flex;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 20px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .dock .pxbtn{font-size:.82rem}
  body.focus .dock{opacity:0;transform:translate(-50%,24px);pointer-events:none}

  #hint{
    position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:15;padding:.35rem .85rem;font-size:.88rem;
    white-space:nowrap;opacity:0;transition:opacity .5s;pointer-events:none;
  }
  #hint.on{opacity:1;animation:bob 1.6s ease-in-out infinite}
  body.focus #hint{opacity:0}
  @keyframes bob{50%{transform:translate(-50%,-4px)}}

  #toast{
    position:fixed;left:50%;bottom:86px;z-index:25;transform:translate(-50%,12px);opacity:0;pointer-events:none;
    padding:.5rem .95rem;max-width:min(560px,calc(100vw - 32px));text-align:center;transition:opacity .2s, transform .25s;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* side panel */
  #panel{
    position:fixed;top:16px;right:16px;bottom:16px;width:min(460px,calc(100vw - 32px));z-index:30;
    display:flex;flex-direction:column;overflow:hidden;
    transform:translateX(calc(100% + 40px));visibility:hidden;
    transition:transform .5s cubic-bezier(.2,.9,.2,1.04), visibility 0s linear .5s;
  }
  #panel.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.9,.2,1.04), visibility 0s}
  .panel-head{display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;background:var(--indigo);color:var(--washi);flex:none}
  .panel-head .kanji{
    display:grid;place-items:center;width:2.5rem;height:2.5rem;flex:none;background:var(--red);color:var(--washi);
    font-size:1.45rem;line-height:1;box-shadow:inset -3px -3px 0 rgba(0,0,0,.22), inset 3px 3px 0 rgba(255,255,255,.2);
  }
  .panel-head h2{font-weight:400;font-size:1.02rem;margin-right:auto;line-height:1.3}
  .panel-body{flex:1;overflow:auto;padding:1rem 1.15rem 1.5rem;overscroll-behavior:contain}
  #panel .panel-body > *{opacity:0;transform:translateY(10px)}
  #panel.open .panel-body > *{animation:rise .45s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  /* panel content */
  .panel-body h3{font-size:1.02rem;font-weight:400;margin:1rem 0 .35rem;border-bottom:2px dotted rgba(43,34,48,.35);padding-bottom:.2rem}
  .panel-body h3:first-child{margin-top:0}
  .panel-body p{margin:.4rem 0}
  .dim{opacity:.7;font-size:.88em}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:.45rem 0}
  .tag{background:var(--washi-d);padding:.05rem .5rem;font-size:.8rem;border:2px solid var(--sumi)}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:.6rem 0}
  .stats div{background:var(--washi-d);border:2px solid var(--sumi);padding:.4rem .5rem;text-align:center}
  .stats b{display:block;font-size:1.35rem;font-weight:400;color:var(--red);line-height:1.2}
  .stats span{font-size:.75rem}
  .two{display:grid;grid-template-columns:1fr;gap:10px}
  .card{border:2px solid var(--sumi);background:rgba(255,255,255,.4);padding:.6rem .75rem}
  .card.hl{background:var(--red);color:#fff}
  .card.hl a{color:#fff}
  .row{display:grid;grid-template-columns:64px 1fr;gap:.2rem .8rem;padding:.5rem 0;border-bottom:2px dotted rgba(43,34,48,.3)}
  .row .k{color:var(--red)}
  .row small{display:block;opacity:.75}
  .shot{width:100%;height:auto;border:2px solid var(--sumi);display:block;margin:.4rem 0}
  .pf{columns:2 150px;column-gap:10px}
  .pf figure{break-inside:avoid;margin:0 0 10px;border:2px solid var(--sumi);background:#fff}
  .pf img{width:100%;height:auto;display:block}
  .pf figcaption{padding:.3rem .5rem;font-size:.8rem;background:var(--washi-d)}
  .pf figcaption b{font-weight:400;display:block;color:var(--red);font-size:.72rem}
  .portrait{float:right;width:104px;margin:0 0 .5rem 1rem;border:3px solid var(--sumi)}
  .omikuji{text-align:center;padding:1.2rem .5rem}
  .omikuji .big{font-size:3rem;color:var(--red);line-height:1.2}

  /* loader */
  #loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#2b2230;color:var(--washi);transition:opacity .7s ease, visibility 0s linear .7s}
  #loader.done{opacity:0;visibility:hidden}
  #loader .ttl{font-size:1.5rem;letter-spacing:.12em;margin-bottom:1rem;text-align:center}
  #loader .ttl em{font-style:normal;color:var(--gold)}
  .bar{width:240px;height:18px;border:3px solid var(--washi);padding:2px;margin:0 auto}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s steps(6)}
  #loader .sub{margin-top:.8rem;text-align:center;font-size:.8rem;opacity:.75;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}

  /* reader mode */
  #reader{display:none;max-width:860px;margin:100px auto 48px;padding:0 14px}
  #reader section{margin-bottom:22px}
  #reader .two{grid-template-columns:1fr 1fr}
  #reader .stats{grid-template-columns:repeat(4,1fr)}
  body.read #scene, body.read .dock, body.read #hint, body.read #panel{display:none}
  body.read #reader{display:block}

  @media (max-width:700px){
    .hud{padding:8px}
    .brand small{display:none}
    .tools .pxbtn{font-size:.76rem;padding:.28rem .5rem}
    #panel{top:auto;left:10px;right:10px;bottom:10px;width:auto;height:60dvh;transform:translateY(calc(100% + 30px))}
    #hint{top:auto;bottom:120px}
    .dock{bottom:8px}
    .dock .pxbtn{font-size:.76rem;padding:.28rem .5rem}
    #reader .two{grid-template-columns:1fr}
    #reader .stats{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){
    #hint.on{animation:none}
    #panel,#panel.open{transition:none}
    #panel.open .panel-body > *{animation:none;opacity:1;transform:none}
  }
</style>

<template id="t-about">

  <h3><span class="lang-zh">企业系统 · AI 原生交付（2026）</span><span class="lang-en">Business systems · AI-native delivery (2026)</span></h3>
  <p class="dim"><span class="lang-zh">以 Claude Code / Codex 为主力，独立承担调研、设计评审、实现、测试、部署与运维；协作规范按“宪法—路由—Skills—Hooks 门禁—评测”五层组织，每个里程碑都有真测证据和独立盲审。</span><span class="lang-en">Claude Code / Codex do most of the typing; I own research, design review, implementation, testing, deployment and operations. The workflow is layered as constitution → router → skills → hook gates → evals, with real-run evidence and a blind review at every milestone.</span></p>

  <div class="row"><span class="k">2026.08</span><div><b><span class="lang-zh">AI 中台 · LLM 网关</span><span class="lang-en">AI hub · LLM gateway</span></b><small><span class="lang-zh">零依赖 Node 22，作为全部系统唯一的大模型出口：18 个系统独立 Key、模型别名路由、9 类引擎巡检、逐笔计费与钱包续航告警。</span><span class="lang-en">Zero-dependency Node 22 service and the only LLM exit for every system: per-system keys for 18 apps, model alias routing, health probes for 9 engines, per-call cost ledger and budget alerts.</span></small></div></div>
  <div class="row"><span class="k">2026.07</span><div><b><span class="lang-zh">智慧云仓 DIPARK</span><span class="lang-en">DIPARK smart park</span></b><small><span class="lang-zh">Spring Boot 3 + Vue 3 园区运营系统：招商—合同—账单—收款闭环，收款幂等与领域事件，3D 楼宇运营总览（上图为演示数据）。</span><span class="lang-en">Spring Boot 3 + Vue 3 park operations: leasing → contract → billing → payment, idempotent receipts and domain events, a 3D building overview (demo data above).</span></small></div></div>
  <div class="row"><span class="k">2026.08</span><div><b><span class="lang-zh">售卖机 ERP · 租赁业务</span><span class="lang-en">Vending ERP · Leasing</span></b><small><span class="lang-zh">业财一体进销存：40 张表、22 个模块、347 例自动化测试，(R,S) 补货引擎，历史流水导入分毫不差；租赁板块含 IRR 报价与租金计划勾稽。</span><span class="lang-en">Inventory + finance in one: 40 tables, 22 modules, 347 automated tests, an (R,S) replenishment engine and exact legacy import; the leasing module adds IRR quotes and reconciled rent schedules.</span></small></div></div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const body = document.body;
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const T = (zh, en) => `<span class="lang-zh">${zh}</span><span class="lang-en">${en}</span>`;
  const isEn = () => body.dataset.lang === 'en';

  /* ================= colour + math utils ================= */
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  function shade(c, f) {
    const [r, g, b] = hex(c), t = f < 0 ? 0 : 255, p = Math.abs(f);
    return `rgb(${Math.round(r + (t - r) * p)},${Math.round(g + (t - g) * p)},${Math.round(b + (t - b) * p)})`;
  }
  function mix(a, b, t) {
    const A = hex(a), B = hex(b);
    return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
  }
  const faces = (top) => ({ top, left: shade(top, -0.12), right: shade(top, -0.27), edge: shade(top, -0.5) });
  const rnd = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  const C = {
    ink: '#2b2230', cream: '#fbf3e1', paper: '#f7efdc', red: '#d64933', redD: '#a33424', gold: '#f2c14e',
    indigo: '#34467d', blueD: '#4e6da6', orange: '#e38b3c',
    sakura: '#f7b7c8', sakuraD: '#ec8fab', sakuraL: '#fdd8e2',
    wood: '#c48a52', woodD: '#8f5a33', woodDD: '#5e3a20', woodL: '#ddb07a',
    plasterL: '#f2e6cb', plasterR: '#e3d2ae', tatami: '#d8cf8e', tatamiB: '#cec486', heri: '#3f5a3a'
  };

  /* ================= state ================= */
  const hour = new Date().getHours();
  const savedNight = store.get('night');
  let nightTarget = savedNight ? (savedNight === '1' ? 1 : 0) : ((hour >= 18 || hour < 6) ? 1 : 0);
  let nightT = nightTarget;
  let sound = false, hinting = true, introActive = true;
  let hovered = null, extHover = null, focused = null, lastFocused = null, focusT = 0;
  let catAwakeUntil = 0, furinAmp = 0, NOW = 0;
  const lift = {}, pop = {};
  let mouse = null;

  /* ================= audio ================= */
  let ac = null;
  function tone(freq, dur = 0.08, type = 'square', vol = 0.035, delay = 0) {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  const chime = () => { tone(2093, 1.4, 'sine', 0.05); tone(3136, 1.1, 'sine', 0.025, 0.02); tone(2637, 1.2, 'sine', 0.02, 0.09); };

  /* ================= canvas + camera ================= */
  const cv = $('#scene'), ctx = cv.getContext('2d');
  let VW = 1, VH = 1, DPR = 1, S = 1;
  const BB = [128, 4, 626, 424];                 // logical bounds of the diorama
  const cam = { x: 418, y: 132, z: 3 };          // starts close on the window for the intro
  let camAnim = null;
  const par = { x: 0, y: 0 };

  const home = () => ({
    x: (BB[0] + BB[2]) / 2,
    y: (BB[1] + BB[3]) / 2 + ((VW < 700 ? 128 : 76) - 74) / (2 * S),
    z: 1
  });
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    VW = window.innerWidth; VH = window.innerHeight;
    cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
    const bw = BB[2] - BB[0], bh = BB[3] - BB[1];
    S = VW < 700 ? Math.min(VW / (bw * 0.96), (VH - 190) / bh) : Math.min(VW / (bw * 1.1), (VH - 150) / (bh * 1.02));
    if (focused) focusCam(focused, 0);
    else if (!introActive && !camAnim) Object.assign(cam, home());
  }
  function camGo(to, dur) {
    if (RM || !dur) { Object.assign(cam, to); camAnim = null; return; }
    camAnim = { from: { ...cam }, to, t0: performance.now(), dur };
  }
  function stepCam(now) {
    if (!camAnim) return;
    const k = clamp((now - camAnim.t0) / camAnim.dur, 0, 1), e = ease(k);
    ['x', 'y', 'z'].forEach((p) => { cam[p] = camAnim.from[p] + (camAnim.to[p] - camAnim.from[p]) * e; });
    if (k >= 1) camAnim = null;
  }
  function setCam() {
    const k = S * cam.z * DPR;
    ctx.setTransform(k, 0, 0, k, DPR * VW / 2 - k * (cam.x + par.x), DPR * VH / 2 - k * (cam.y + par.y));
  }
  const screenSpace = () => ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  function toLogical(mx, my) { const k = S * cam.z; return [(mx - VW / 2) / k + cam.x + par.x, (my - VH / 2) / k + cam.y + par.y]; }
  function toScreen(lx, ly) { const k = S * cam.z; return [(lx - cam.x - par.x) * k + VW / 2, (ly - cam.y - par.y) * k + VH / 2]; }

  /* ================= isometric primitives =================
     World: x → right-down, y → left-down, z → up. Floor of the room is x,y ∈ [0,200]. */
  const OX = 360, OY = 168;
  const P = (x, y, z = 0) => [OX + (x - y), OY + (x + y) * 0.5 - z];

  let curId = null, inPlane = false, hits = [], hitList = [];
  function reg(pts) { if (curId && !inPlane) hits.push({ id: curId, poly: pts }); }
  function path(pts) { ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); }
  function fp(pts, fill, stroke, lw = 0.6) {

    const b = boundsOf(id);
    if (!b) return;
    const bw = Math.max(20, b[2] - b[0]), bh = Math.max(20, b[3] - b[1]), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
    const mob = VW < 700;
    const z = clamp(Math.min((mob ? VW * 0.62 : VW * 0.34) / (bw * S), (mob ? VH * 0.26 : VH * 0.52) / (bh * S)), 1.4, 4.2);
    const k = S * z;
    camGo(mob ? { x: cx, y: cy + (VH * 0.3) / k, z } : { x: cx + (VW * 0.2) / k, y: cy, z }, dur);
  }
  function focusOn(id, cb) {
    focused = id; lastFocused = id; hovered = null;
    body.classList.add('focus');
    focusCam(id);
    tone(523, 0.07); tone(784, 0.09, 'square', 0.035, 0.07);
    setTimeout(() => { if (focused === id && cb) cb(); }, RM ? 0 : 380);
  }
  function unfocus() {
    if (!focused) return;
    closePanel(); focused = null;
    body.classList.remove('focus');
    camGo(home(), 800); tone(392, 0.07);
  }

  let toastTimer;
  const toastEl = $('#toast');
  function toast(html) {
    toastEl.innerHTML = html; toastEl.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2800);
  }
  function stopHint() { if (!hinting) return; hinting = false; $('#hint').classList.remove('on'); }

  function activate(id) {
    stopHint();
    pop[id] = NOW;
    const o = OBJ[id];
    if (o && o.panel) return focusOn(id, () => openPanel(id));
    if (id === 'tea') {
      return focusOn('tea', () => {
        const f = fortunes[fi++ % fortunes.length];
        openPanel('omikuji', `<div class="omikuji"><div class="big">${f[0]}</div><p>${T(f[2], f[3])}</p><p class="dim">${f[1]}</p></div><p class="dim">${T('再点一次茶杯可以重新抽签。', 'Click the tea again for another fortune.')}</p>`);
      });
    }
    if (focused) unfocus();
    if (id === 'cat') { catAwakeUntil = NOW + 2600; tone(880, 0.08, 'triangle', 0.04); tone(660, 0.12, 'triangle', 0.04, 0.08); const m = meows[mi++ % meows.length]; return toast(T(m[0], m[1])); }
    if (id === 'lantern') { setNight(!nightTarget); tone(nightTarget ? 330 : 520, 0.12, 'triangle'); return toast(nightTarget ? T('点亮行灯 —— 夜が来た。', 'Lights on — night falls.') : T('熄灯 —— 朝になった。', 'Lights out — morning again.')); }
    if (id === 'window') return toast(T('窗外：富士山、五重塔和一枝樱花。（本人其实在广州。）', 'Outside: Mt. Fuji, a pagoda and sakura. (Actually based in Guangzhou.)'));
    if (id === 'furin') { furinAmp = 1; chime(); return toast(sound ? T('ちりん——', 'Chirin—') : T('ちりん——（打开右上角音效可以听到风铃）', 'Chirin— (turn on Sound to hear it)')); }
    if (id === 'clock') { const d = gzNow(), p2 = (n) => String(n).padStart(2, '0'); return toast(T(`广州时间 ${p2(d.getHours())}:${p2(d.getMinutes())}`, `Guangzhou time ${p2(d.getHours())}:${p2(d.getMinutes())}`)); }
    if (id === 'scroll') return toast(T('温故知新 —— 用新的模型，读懂旧的建筑。', '温故知新 — new models to understand old buildings.'));
    if (id === 'ramune') {
      const [x, y] = P(141, 84, 43);
      for (let i = 0; i < 16; i++) bubbles.push({ x: x + (Math.random() - 0.5) * 2, y: y - Math.random() * 2, vy: -(8 + Math.random() * 10), life: 1, ph: Math.random() * 6 });
      tone(1568, 0.06, 'square', 0.03); tone(2093, 0.09, 'square', 0.03, 0.06);
      return toast(T('啵——弹珠汽水开了。夏天的味道。', 'Pop — ramune opened. Tastes like summer.'));
    }
    if (id === 'tree') { for (let i = 0; i < 46; i++) spawnPetal(true); tone(784, 0.1, 'triangle'); tone(988, 0.12, 'triangle', 0.03, 0.08); return toast(T('桜吹雪！', 'Sakura blizzard!')); }
    if (id === 'toro') return toast(T('石灯籠：天黑以后会亮起来。', 'Stone lantern: it lights up after dark.'));
  }
  function setNight(v) { nightTarget = v ? 1 : 0; store.set('night', v ? '1' : '0'); }

  /* pointer */
  cv.addEventListener('pointermove', (e) => { mouse = [e.clientX, e.clientY]; });
  cv.addEventListener('pointerleave', () => { mouse = null; hovered = null; cv.style.cursor = ''; });
  cv.addEventListener('click', (e) => {
    if (introActive) return;
    mouse = [e.clientX, e.clientY];
    const id = pick(e.clientX, e.clientY);
    if (id && id !== focused) activate(id);
    else if (!id && focused) unfocus();
  });
  function updateHover() {
    if (!mouse || introActive || focused) { if (hovered) hovered = null; cv.style.cursor = ''; return; }
    const id = pick(mouse[0], mouse[1]);
    if (id !== hovered) { hovered = id; if (id) tone(1200, 0.025, 'square', 0.018); }
    cv.style.cursor = id ? 'pointer' : '';
  }
  $('#panelClose').addEventListener('click', unfocus);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && focused) unfocus(); });

  /* dock */
  const dock = $('#dock');
  ['about', 'heritage', 'work', 'exp', 'portfolio', 'toolbox', 'contact', 'cv'].forEach((id) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pxbtn'; b.innerHTML = T(OBJ[id].dock[0], OBJ[id].dock[1]);
    b.addEventListener('click', () => activate(id));
    b.addEventListener('mouseenter', () => { extHover = id; });
    b.addEventListener('mouseleave', () => { extHover = null; });
    b.addEventListener('focus', () => { extHover = id; });
    b.addEventListener('blur', () => { extHover = null; });
    dock.appendChild(b);
  });

  /* HUD */
  $('#btnNight').addEventListener('click', () => { setNight(!nightTarget); tone(440, 0.08); });
  $('#btnSound').addEventListener('click', (e) => { sound = !sound; e.currentTarget.setAttribute('aria-pressed', String(sound)); tone(784, 0.1); });
  const setLang = (l) => { body.dataset.lang = l; document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en'; };
  { const l = store.get('lang'); if (l === 'en' || l === 'zh') setLang(l); }
  $('#btnLang').addEventListener('click', () => { const n = isEn() ? 'zh' : 'en'; setLang(n); store.set('lang', n); });
  const reader = $('#reader');
  $('#btnMode').addEventListener('click', (e) => {
    const on = !body.classList.contains('read');
    if (on && !reader.children.length) {
      ['about', 'heritage', 'work', 'exp', 'portfolio', 'toolbox', 'contact'].forEach((id) => {
        const sec = document.createElement('section'); sec.className = 'px';
        sec.innerHTML = `<div class="panel-head"><span class="kanji" aria-hidden="true">${OBJ[id].kanji}</span><h2>${TITLES[id]}</h2></div><div class="panel-body">${$('#t-' + id).innerHTML}</div>`;
        reader.appendChild(sec);
      });
    }
    if (on && focused) unfocus();
    body.classList.toggle('read', on);
    e.currentTarget.setAttribute('aria-pressed', String(on));
    window.scrollTo(0, 0);
    if (!on) resize();
  });

  /* loading + intro */
  let doneCount = 0, finished = false;
  const total = srcs.length + 1;
  function progress() {
    doneCount++;
    $('#barFill').style.width = Math.round(Math.min(1, doneCount / total) * 100) + '%';
    if (doneCount >= total) finishLoad();
  }
  srcs.forEach((src) => {
    const im = new Image();
    im.onload = () => { imgs[src] = im; if (src.includes('portrait')) makePortrait(im); progress(); };
    im.onerror = progress;
    im.src = src;
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(progress); else progress();
  setTimeout(finishLoad, 3500);
  function finishLoad() {
    if (finished) return; finished = true;
    $('#barFill').style.width = '100%';
    setTimeout(() => { $('#loader').classList.add('done'); startIntro(); }, RM ? 0 : 300);
  }
  function startIntro() {
    const go = () => { introActive = false; setTimeout(() => { if (hinting) $('#hint').classList.add('on'); }, 300); };
    if (RM) { Object.assign(cam, home()); go(); return; }
    camGo(home(), 2300);
    setTimeout(go, 2100);
  }

  /* main loop */
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (body.classList.contains('read')) return;
    const minStep = VW < 700 ? 30 : 15;
    if (now - last < minStep) return;
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now; NOW = now;
    const t = now / 1000;
    stepCam(now);
    nightT += (nightTarget - nightT) * Math.min(1, dt * 2.4);
    focusT += ((focused ? 1 : 0) - focusT) * Math.min(1, dt * 5);
    furinAmp *= Math.pow(0.35, dt);
    Object.keys(OBJ).forEach((id) => {
      const tg = (hovered === id || extHover === id || focused === id) ? 1 : 0;
      lift[id] = (lift[id] || 0) + (tg - (lift[id] || 0)) * Math.min(1, dt * 12);
    });
    const pt = (!focused && !introActive && mouse && VW >= 700) ? [(mouse[0] / VW - 0.5) * 10 / cam.z, (mouse[1] / VH - 0.5) * 6 / cam.z] : [0, 0];
    par.x += (pt[0] - par.x) * Math.min(1, dt * 3); par.y += (pt[1] - par.y) * Math.min(1, dt * 3);
    stepParticles(dt, t);
    render(t);
    updateHover();
  }

  window.addEventListener('resize', resize);
  resize();
  Object.assign(cam, { x: 418, y: 132, z: 3 });
  requestAnimationFrame(frame);
})();
</script>
</body>
